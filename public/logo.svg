<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1652F0"/>
      <stop offset="100%" stop-color="#FF2D78"/>
    </linearGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1652F0"/>
      <stop offset="100%" stop-color="#4A7DFF"/>
    </linearGradient>
  </defs>

  <!-- Whale icon mark -->
  <!-- Body -->
  <path d="M6 28 C6 16 14 10 24 10 C34 10 41 16 43 26 C45 33 43 38 38 40 L10 40 C7 38 6 34 6 28Z"
        fill="url(#body)"/>
  <!-- Tail fluke right -->
  <path d="M38 38 L48 44 L43 36Z" fill="url(#body)" opacity="0.9"/>
  <!-- Tail fluke left -->
  <path d="M38 38 L46 32 L43 36Z" fill="url(#body)" opacity="0.7"/>
  <!-- Dorsal fin -->
  <path d="M22 10 L27 4 L32 10Z" fill="url(#fin)" opacity="0.85"/>
  <!-- Eye -->
  <circle cx="17" cy="23" r="2.5" fill="white"/>
  <circle cx="17.8" cy="23" r="1.2" fill="#0A0F1E"/>
  <!-- Water spray dots -->
  <circle cx="29" cy="6"  r="1.2" fill="#FF2D78" opacity="0.7"/>
  <circle cx="33" cy="3"  r="0.9" fill="#1652F0" opacity="0.6"/>
  <circle cx="26" cy="3"  r="0.8" fill="#FF2D78" opacity="0.5"/>

  <!-- Wordmark -->
  <text x="56" y="22" font-family="'Space Grotesk', sans-serif" font-weight="700"
        font-size="16" fill="#0A0F1E" letter-spacing="-0.3">Whale</text>
  <text x="105" y="22" font-family="'Space Grotesk', sans-serif" font-weight="700"
        font-size="16" fill="url(#body)" letter-spacing="-0.3">Watch</text>
  <!-- Tagline -->
  <text x="56" y="36" font-family="'Inter', sans-serif" font-weight="400"
        font-size="9" fill="#6B7A9F" letter-spacing="0.12em">TRADE · TRACK · PROTECT</text>
</svg>
